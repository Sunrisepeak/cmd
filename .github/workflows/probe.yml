name: probe-okrun-071
on: pull_request
env:
  MCPP_VERSION: 2026.11.19.1
  XLINGS_NON_INTERACTIVE: '1'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: mcpp-community/setup-mcpp@v1
        with: { version: '${{ env.MCPP_VERSION }}' }
      - name: Probe
        run: |
          t=x86_64-openkal
          mcpp build --release --target $t
          img=$(find "$PWD/target" -type f -name 'cmd.exe*' -path "*$t*" | head -1); echo "image=$img"
          file "$img" || true
          echo "== A: COMSPEC as cmd sets it"
          mcpp run cmd.exe --release --target $t -- /c 'echo cs=%COMSPEC%' || true
          echo "== B: whole test.bat (with the program start)"
          cp .github/mcpp/test.bat .github/mcpp/expected.txt .github/mcpp/check.sh .
          mcpp run cmd.exe --release --target $t -- /c test.bat > runB.txt; echo "status $?"; cat runB.txt; sh check.sh runB.txt && echo B-PASS || echo B-FAIL
          echo "== C: COMSPEC given as the image's own path"
          COMSPEC="$img" mcpp run cmd.exe --release --target $t -- /c '"%COMSPEC%" /c exit 3 & echo child=%ERRORLEVEL%' || true
          COMSPEC="$img" mcpp run cmd.exe --release --target $t -- /c test.bat > runC.txt; echo "status $?"; grep -n 'child=' runC.txt; sh check.sh runC.txt && echo C-PASS || echo C-FAIL
          echo "== D: okrun version"
          find ~/.mcpp ~/.xlings -type f -name 'okrun*' 2>/dev/null | head -3
