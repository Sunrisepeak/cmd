name: probe-okrun-071
on: pull_request
env:
  MCPP_VERSION: 2026.11.19.1
  XLINGS_NON_INTERACTIVE: '1'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: mcpp-community/setup-mcpp@v1
        with: { version: '${{ env.MCPP_VERSION }}' }
      - name: Probe
        run: |
          t=x86_64-openkal
          w() { echo "-- $*"; timeout 20 "$@"; echo "status $?"; }
          mcpp build --release --target $t > /dev/null 2>&1
          img=$(ls "$PWD"/target/$t/*/bin/cmd.exe.oke | head -1); echo "image=$img"
          ok=$(find ~/.mcpp -type f -name okrun -path '*openkal-tools@0.7.1*' | head -1); echo "okrun=$ok"
          echo "== D: okrun 0.7.1 directly"
          w "$ok" /c exit 3
          w "$ok" /c exit 3 < /dev/null
          w "$ok" /nonexistent.oke < /dev/null
          w "$ok" "$img" /c exit 3 < /dev/null
          echo "== C: COMSPEC given as the image"
          cp .github/mcpp/test.bat .github/mcpp/expected.txt .github/mcpp/check.sh .
          COMSPEC="$img" timeout 120 "$ok" "$img" /c test.bat > runC.txt < /dev/null; echo "status $?"; grep -n 'child=' runC.txt || true; sh check.sh runC.txt && echo C-PASS || echo C-FAIL
          echo "== E: okrun 0.7.0 (openkal-platform 0.31.0)"
          sed -i 's/"openkal-platform@0\.31\.1"/"openkal-platform@0.31.0"/' mcpp.toml
          mcpp build --release --target $t > /dev/null 2>&1
          ok0=$(find ~/.mcpp -type f -name okrun -path '*openkal-tools@0.7.0*' | head -1); echo "okrun=$ok0"
          w "$ok0" /c exit 3 < /dev/null
          w "$ok0" /nonexistent.oke < /dev/null
