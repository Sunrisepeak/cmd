name: probe-termux
on:
  push:
    branches: [probe/termux]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/w/mcpp.tar.gz" https://github.com/mcpp-community/mcpp/releases/download/v2026.11.18.1/mcpp-2026.11.18.1-linux-x86_64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/w/termux.apk" "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_x86_64.apk"
          cp probe/inside.sh probe/run.sh "$RUNNER_TEMP/w/"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 14G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ${{ runner.temp }}/w/run.sh ${{ runner.temp }}/w
