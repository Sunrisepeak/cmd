[package]
name        = "cmd"
version     = "0.1.0"
description = "A faithful reimplementation of the Windows cmd.exe command interpreter for Unix."
mcpp        = ">=2026.11.19.1"

# Both personalities are built from the same C sources.  COMMAND.COM is the
# classic MS-DOS variant, which additionally executes AUTOEXEC.BAT: the same
# entry, cmain.c, with its own define (each target compiles its entry with its
# own defines).
[build]
c_standard  = "gnu11"
include_dirs = ["."]
sources     = ["*.c", "!cmain.c"]

# On Windows the version-information resource is compiled in as well
# (mcpp/cmd.rc: cmd.rc without winres.h, so UEFI builds it too).
[resources]
files = ["mcpp/cmd.rc"]

# build.mcpp states the Emscripten link and the web page (mcpp.dist.web).
# 0.26.1 is the version openkal-platform 0.31.0 builds with; one build holds one.
[build-dependencies.mcpp]
plugins = { version = "0.26.1", features = ["dist-web"], host-module = true }

# Target names carry the exact CMake output names; build.mcpp suppresses
# mcpp's host-dependent executable suffix.
[targets."cmd.exe"]
kind = "bin"
main = "cmain.c"

[targets."COMMAND.COM"]
kind = "bin"
main = "cmain.c"
defines = ["ENABLE_AUTOEXEC=1"]

# Every row openkal-platform serves takes one release of it, stated here: 0.31.0,
# the openkal 0.26 family, whose build programs use mcpp.plugins 0.26.1, the
# version above (one build holds one). mcpp 2026.11.19.1 serves its own rows with
# this release too; stating it keeps the pair when a later mcpp moves on, and
# 2026.11.19.1 resolves each member of the family at the release named, so a
# newer member listed alone does not displace it. The other rows beyond mcpp's
# own are served by the platform the package index names for them
# (mcpp.platforms: the NetBSD, OpenBSD, GNU/Hurd and Haiku rows) or by one
# pinned here (djgpp-platform 0.2.0, whose runner delivers a run's files).
[target]
i586-dos-djgpp.platform      = "djgpp-platform@0.2.0"
x86_64-linux-musl.platform   = "openkal-platform@0.31.1"
aarch64-linux-musl.platform  = "openkal-platform@0.31.1"
i686-linux-musl.platform     = "openkal-platform@0.31.1"
x86_64-windows-musl.platform = "openkal-platform@0.31.1"
aarch64-macos-musl.platform  = "openkal-platform@0.31.1"
x86_64-openkal.platform      = "openkal-platform@0.31.1"
aarch64-openkal.platform     = "openkal-platform@0.31.1"
i686-openkal.platform        = "openkal-platform@0.31.1"
x86_64-uefi.platform         = "openkal-platform@0.31.1"
i686-dos-musl.platform       = "openkal-platform@0.31.1"

# The System V row's implementation (openkal-svr4) is the platform's statement:
# from 0.30.1 the row writes no PT_PHDR program header, which the kernel of System
# V/386 Release 4.0 needs of a static program, and from 0.31.0 (openkal-svr4 0.3.0)
# a program starts another there (openkal.process). This project runs the row on
# that kernel: AT&T UNIX System V/386 Release 4.0 Version 3.0 in QEMU, booted by
# dirun from xim's svr4-disk-image (TECHNICAL VERIFICATION ONLY: the system is
# proprietary). Its disk driver reads a disk only behind the system's own label, so
# a run's files disk carries it (dirun 0.8.0). The machine is QEMU's translator
# (TCG): on a GitHub-hosted runner the kernel stopped while it booted under KVM,
# and under TCG a run takes seconds. The platform's own runner, an emulation of
# the interface (ibcs-us), is replaced here.
[target.i686-svr4-musl]
platform = "openkal-platform@0.31.1"
runner   = { cmd = ["dirun", "--profile", "{pkg:svr4-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--accel", "tcg", "--", "{}"], host = "any", hosts = ["linux-x86_64"], requires = ["xim:dirun@0.8.0", "xim:svr4-disk-image@4.0.3-20261119", "xim:qemu-x86@9.2.4-1"], enabled = false }

# On a Linux machine the Darwin row is run in PureDarwin (xnu with no macOS
# above it), booted by dirun from the image its project publishes; a Mac runs
# the program itself. The image is a developer preview, not mirrored: an
# experiment. It boots by UEFI, so the runner gives it a firmware. mcpp holds
# that an Apple artifact off macOS is reached only through an execution host
# (`run_under`); here the runner's machine is that host, so the key names a
# program that passes its arguments on. The platform's openkal-macos (0.24.0) binds
# the private parts of fork weakly, so the program starts where libSystem does not
# export them (PureDarwin).
[target.x86_64-macos-musl]
platform  = "openkal-platform@0.31.1"
run_under = ["env"]
runner = { cmd = ["dirun", "--profile", "{pkg:puredarwin-disk-image}/dirun.toml", "--var", "firmware={pkg:ovmf}/share/edk2/edk2-x86_64-code.fd", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"], host = "any", hosts = ["linux-x86_64"], requires = ["xim:dirun@0.7.0", "xim:puredarwin-disk-image@25.5-20261118-1", "xim:ovmf@9.2.4-4", "xim:qemu-x86@9.2.4-1"], enabled = false }

# openkal's musl has neither sysctl nor _NSGetExecutablePath (lselfpath.c).
[target.'cfg(c-abi = "musl")'.build]
defines = ["CMD_LIBC_MUSL=1"]

# DJGPP has no setpriority(); the System V shims use nice().
[target.i586-dos-djgpp.build]
defines = ["LIBCMD_SYSV=1"]


# The browser build of wasm32-emscripten; build.mcpp states its link.
[profile.web]
opt = 2

