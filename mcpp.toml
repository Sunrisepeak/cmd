[package]
name        = "cmd"
version     = "0.1.0"
description = "A faithful reimplementation of the Windows cmd.exe command interpreter for Unix."
mcpp        = ">=2026.11.18.1"

# Both personalities are built from the same C sources.  COMMAND.COM is the
# classic MS-DOS variant, which additionally executes AUTOEXEC.BAT: the same
# entry, cmain.c, with its own define (each target compiles its entry with its
# own defines).
[build]
c_standard  = "gnu11"
include_dirs = ["."]
sources     = ["*.c", "!cmain.c"]

# On Windows the version-information resource is compiled in as well
# (mcpp/cmd.rc: cmd.rc without winres.h, so UEFI builds it too).
[resources]
files = ["mcpp/cmd.rc"]

# build.mcpp states the Emscripten link and the web page (mcpp.dist.web).
# 0.22.1 is the version openkal-platform 0.29.2 builds with; one build holds one.
[build-dependencies.mcpp]
plugins = { version = "0.22.1", features = ["dist-web"], host-module = true }

# Target names carry the exact CMake output names; build.mcpp suppresses
# mcpp's host-dependent executable suffix.
[targets."cmd.exe"]
kind = "bin"
main = "cmain.c"

[targets."COMMAND.COM"]
kind = "bin"
main = "cmain.c"
defines = ["ENABLE_AUTOEXEC=1"]

# A row the built-in table does not serve is served by the platform the package
# index names for it (openkal-platform: i686-linux-musl, i686-openkal,
# x86_64-uefi, i686-dos-musl; mcpp.platforms: the NetBSD and OpenBSD rows;
# djgpp-platform: i586-dos-djgpp). DJGPP's row is pinned: 0.2.0's runner
# delivers a run's files (test.bat).
[target]
i586-dos-djgpp.platform  = "djgpp-platform@0.2.0"
# The System V row is openkal-platform 0.30.0's, later than mcpp's default release
# of it: the row's implementation (openkal-svr4) is the platform's statement.
i686-svr4-musl.platform  = "openkal-platform@0.30.0"
# GNU/Hurd and Haiku are rows of this project's own (mcpp/platforms/): each
# states its row, the base system it is built over (a sysroot package of xim)
# and the machine it is run in (a disk image of xim, booted by dirun).
x86_64-hurd.platform     = { path = "mcpp/platforms/hurd" }
x86_64-haiku.platform    = { path = "mcpp/platforms/haiku" }

# The rows openkal-platform serves, the engine's own among them (the musl rows,
# openkal, UEFI), take mcpp's default release of it: 0.29.2 from mcpp
# 2026.11.18.1, whose build programs use mcpp.plugins 0.22.1, the version
# above, and which states the hosts of each runner, so a row the machine starts
# itself (x86_64-windows-musl on Windows) runs with none.

# openkal's musl has neither sysctl nor _NSGetExecutablePath (lselfpath.c).
[target.'cfg(c-abi = "musl")'.build]
defines = ["CMD_LIBC_MUSL=1"]

# DJGPP has no setpriority(); the System V shims use nice().
[target.i586-dos-djgpp.build]
defines = ["LIBCMD_SYSV=1"]


# The browser build of wasm32-emscripten; build.mcpp states its link.
[profile.web]
opt = 2
