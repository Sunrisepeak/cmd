[package]
name        = "cmd"
version     = "0.1.0"
description = "A faithful reimplementation of the Windows cmd.exe command interpreter for Unix."
mcpp        = ">=2026.11.7.1"

# Both personalities are built from the same C sources.  COMMAND.COM is the
# classic MS-DOS variant, which additionally executes AUTOEXEC.BAT.
# mcpp compiles shared sources once, so the entry file is the only place a
# per-target define can take effect; cmain.c is the cmd.exe entry below and
# mcpp/cmain_command.c is the COMMAND.COM entry.
[build]
c_standard  = "gnu11"
include_dirs = ["."]
sources     = ["*.c", "!cmain.c"]

# On Windows the version-information resource is compiled in as well
# (mcpp/cmd.rc: cmd.rc without winres.h, so UEFI builds it too).
[resources]
files = ["mcpp/cmd.rc"]

# build.mcpp states the Emscripten link and the web page (mcpp.dist.web).
[build-dependencies.mcpp]
plugins = { version = "0.21.0", features = ["dist-web"], host-module = true }

# Target names carry the exact CMake output names; build.mcpp suppresses
# mcpp's host-dependent executable suffix.
[targets."cmd.exe"]
kind = "bin"
main = "cmain.c"

[targets."COMMAND.COM"]
kind = "bin"
main = "mcpp/cmain_command.c"
defines = ["ENABLE_AUTOEXEC=1"]

# Targets served by platform packages, beyond mcpp's built-in ones.
[target]
i686-linux-musl.platform = "openkal-platform@0.28.0"
i686-openkal.platform    = "openkal-platform@0.28.0"
x86_64-uefi.platform     = "openkal-platform@0.28.0"
i686-dos-musl.platform   = "openkal-platform@0.28.0"
i586-dos-djgpp.platform  = "djgpp-platform@0.1.0"

# openkal's musl has neither sysctl nor _NSGetExecutablePath (lselfpath.c).
[target.'cfg(c-abi = "musl")'.build]
defines = ["CMD_LIBC_MUSL=1"]

# DJGPP has no setpriority(); the System V shims use nice().
[target.i586-dos-djgpp.build]
defines = ["LIBCMD_SYSV=1"]


# The browser build of wasm32-emscripten; build.mcpp states its link.
[profile.web]
opt = 2
