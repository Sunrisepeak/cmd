[package]
name        = "cmd"
version     = "0.1.0"
description = "A faithful reimplementation of the Windows cmd.exe command interpreter for Unix."
mcpp        = ">=2026.11.7.1"

# Both personalities are built from the same C sources.  COMMAND.COM is the
# classic MS-DOS variant, which additionally executes AUTOEXEC.BAT.
# mcpp compiles shared sources once, so the entry file is the only place a
# per-target define can take effect; cmain.c is the cmd.exe entry below and
# mcpp/cmain_command.c is the COMMAND.COM entry.
[build]
c_standard  = "gnu11"
include_dirs = ["."]
sources     = ["*.c", "!cmain.c"]

# On Windows the version-information resource is compiled in as well.
# mcpp/cmd.rc is cmd.rc without its winres.h include, so it also compiles for
# PE targets that have no Windows SDK headers (x86_64-uefi).
[resources]
files = ["mcpp/cmd.rc"]

# Target names carry the exact CMake output names; build.mcpp suppresses
# mcpp's host-dependent executable suffix.
[targets."cmd.exe"]
kind = "bin"
main = "cmain.c"

[targets."COMMAND.COM"]
kind = "bin"
main = "mcpp/cmain_command.c"
defines = ["ENABLE_AUTOEXEC=1"]

# The musl C library of openkal-platform serves the FreeBSD, macOS, UEFI and
# DOS rows as well; it has neither sysctl(KERN_PROC_PATHNAME) nor
# _NSGetExecutablePath, so lselfpath.c takes its generic path there.
[target.'cfg(c-abi = "musl")'.build]
defines = ["CMD_LIBC_MUSL=1"]

# Emscripten: the host file system through node, exit when the interpreter
# returns, setjmp/longjmp (a builtin's interruption) as wasm exceptions, and a
# stack the interpreter's recursion fits in.
[target.wasm32-emscripten.build]
cflags  = ["-sSUPPORT_LONGJMP=wasm"]
ldflags = ["-sNODERAWFS=1", "-sEXIT_RUNTIME=1", "-sSUPPORT_LONGJMP=wasm", "-sSTACK_SIZE=1048576"]

# Rows the openkal platform serves beyond mcpp's built-in table: 32-bit Linux,
# the 32-bit ok image, UEFI applications and (experimental) DOS.
[target.i686-linux-musl]
platform = "openkal-platform@0.28.0"

[target.i686-openkal]
platform = "openkal-platform@0.28.0"

[target.x86_64-uefi]
platform = "openkal-platform@0.28.0"

[target.i686-dos-musl]
platform = "openkal-platform@0.28.0"

# 32-bit DOS through DJGPP, run under DOSBox.  LIBCMD_SYSV selects the System V
# shims of lsysport.c and lfs.c; among them nice() stands for setpriority(),
# which DJGPP does not have.
[target.i586-dos-djgpp]
platform = "djgpp-platform@0.1.0"

[target.i586-dos-djgpp.build]
defines = ["LIBCMD_SYSV=1"]
