# Haiku (x86_64), a row of this project's own. Built on Linux with the LLVM
# toolchain over Haiku's base system (xim's x86_64-haiku-sysroot: libroot, with
# GCC's run-time and start files), and run in a nightly image of the system,
# booted by dirun (xim's haiku-disk-image).
[package]
name    = "cmd-platform-haiku"
version = "0.0.0"

[platform]
targets   = ["x86_64-haiku"]
toolchain = "llvm@23.1.3"

[platform.link]
driver = "compiler"

[[platform.system]]
name  = "haiku"
uname = "Haiku"

[[platform.define]]
triple        = "x86_64-haiku"
clang-triple  = "x86_64-unknown-haiku"
object-format = "elf"
family        = "unix"
execution     = "haiku"
tier          = "preview"
standard      = true

# The runner boots a machine and fetches its image on first use, so it waits to
# be enabled (MCPP_TARGET_X86_64_HAIKU_RUNNER_ENABLED=true, or the project).
[[platform.provider]]
serves  = ["x86_64-haiku"]
sysroot = "xim:x86_64-haiku-sysroot@hrev60431"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:haiku-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"], host = "any", hosts = ["linux-x86_64"], requires = ["xim:dirun@0.7.0", "xim:haiku-disk-image@hrev60431", "xim:qemu-x86@9.2.4-1"], enabled = false }
