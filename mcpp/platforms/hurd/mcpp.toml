# GNU/Hurd (x86_64), a row of this project's own. Built on Linux with the LLVM
# toolchain over Debian GNU/Hurd's base system (xim's x86_64-hurd-sysroot:
# glibc on the Hurd, with GCC's run-time), and run in Debian's image of the
# system, booted by dirun (xim's hurd-disk-image).
[package]
name    = "cmd-platform-hurd"
version = "0.0.0"

[platform]
targets   = ["x86_64-hurd"]
toolchain = "llvm@23.1.3"

[platform.link]
driver = "compiler"

# The compiler's run-time is not built for the Hurd: the base's libgcc is linked.
[platform.build.'cfg(os = "hurd")']
ldflags = ["-rtlib=libgcc", "--unwindlib=libgcc"]

[[platform.system]]
name  = "hurd"
uname = "GNU"

[[platform.define]]
triple        = "x86_64-hurd"
clang-triple  = "x86_64-pc-hurd-gnu"
loader        = "/lib/ld-x86-64.so.1"
object-format = "elf"
family        = "unix"
execution     = "hurd"
tier          = "preview"
standard      = true

# The runner boots a machine and fetches its image on first use, so it waits to
# be enabled (MCPP_TARGET_X86_64_HURD_RUNNER_ENABLED=true, or the project).
[[platform.provider]]
serves  = ["x86_64-hurd"]
sysroot = "xim:x86_64-hurd-sysroot@20261118"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:hurd-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"], host = "any", hosts = ["linux-x86_64"], requires = ["xim:dirun@0.7.0", "xim:hurd-disk-image@20260314", "xim:qemu-x86@9.2.4-1"], enabled = false }
